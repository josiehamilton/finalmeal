<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Your Final Meal code</title>
  </head>
  <!-- Email clients cannot read the app's design tokens, so these two colours are copied from
       packages/ui-tokens (night #0B0A09, bone #F3EDE4). Keep in sync if the tokens change. -->
  <body style="margin:0;padding:0;background-color:#0B0A09;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0B0A09;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;">
            <tr>
              <td style="padding-bottom:32px;font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-size:28px;line-height:1.1;color:#F3EDE4;">
                Final Meal
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:16px;font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.4;color:#F3EDE4;">
                Here’s your Final Meal code
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:44px;line-height:1.1;font-weight:700;letter-spacing:8px;color:#F3EDE4;">
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td style="font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;color:#F3EDE4;opacity:0.7;">
                It works for 10 minutes. If you didn’t ask for it, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
